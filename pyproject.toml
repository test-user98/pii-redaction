[project]
name = "pii-redact"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pymupdf", "python-docx", "pyyaml", "faker", "rapidocr-onnxruntime",
  "requests", "gliner2", "torch", "transformers", "peft",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pii-redact = "pii_redact.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
