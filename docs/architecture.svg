<line x1="30" y1="632" x2="930" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="96" y="640" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="116" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FOCAL STEP</text>
<rect x="240" y="640" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="4,3"/><text x="260" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OPTIONAL / ROUTED</text>
<rect x="400" y="640" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/><text x="420" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EXTERNAL MODEL</text>
<rect x="560" y="640" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="580" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">OUTPUT / STORE</text>
</svg>