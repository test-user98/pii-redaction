<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="arch-title">PII redaction pipeline architecture</title>
<desc id="arch-desc">Architecture showing a PDF or DOCX parsed into positioned words, optional OCR of image blocks, three independent PII finders whose results are unioned and judged, consistent surrogate generation, same-format writing, and verification.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- zone: finders -->
<rect x="40" y="208" width="880" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="56" y="212" width="176" height="12" rx="2" fill="#f5f5f5"/>
<text x="144" y="221" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FINDERS — RUN IN PARALLEL, UNIONED</text>

<!-- arrows (before boxes) -->
<!-- input -> parse -->
<line x1="40" y1="112" x2="80" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- parse <-> ocr, dashed, two lanes 16px apart -->
<line x1="320" y1="100" x2="400" y2="100" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="336" y="80" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="360" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">IMAGES</text>
<line x1="400" y1="124" x2="320" y2="124" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="336" y="132" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="360" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WORDS</text>
<!-- parse -> three finders (fan from bottom edge of parse: x=140,200,260) -->
<path d="M 140,144 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 200,144 V 168 Q 200,176 208,176 H 472 Q 480,176 480,184 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 260,144 V 152 Q 260,160 268,160 H 772 Q 780,160 780,168 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="596" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="636" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HARD PAGES</text>
<!-- finders -> judge (top edge attach 420/480/540) -->
<path d="M 160,304 V 352 Q 160,360 168,360 H 412 Q 420,360 420,368 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 480,304 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 780,304 V 352 Q 780,360 772,360 H 548 Q 540,360 540,368 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="588" y="340" width="112" height="12" rx="2" fill="#f5f5f5"/>
<text x="644" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VERBATIM SPANS</text>
<!-- judge -> surrogates -->
<path d="M 480,464 V 488 Q 480,496 472,496 H 168 Q 160,496 160,504 V 536" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="272" y="476" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="320" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">KEPT SPANS</text>
<!-- surrogates -> writer -> verify -->
<line x1="280" y1="568" x2="360" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="568" x2="680" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- boxes -->
<!-- input marker (not a node): label at left -->
<text x="8" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">PDF</text>
<text x="8" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">DOCX</text>

<rect x="80" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="80" y="80" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="88" y="86" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/><text x="108" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>
<text x="200" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Parse · views · route</text>
<text x="200" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">PyMuPDF / python-docx · char→word map</text>

<rect x="400" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="80" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="408" y="86" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/><text x="434" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
<text x="500" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">OCR image blocks</text>
<text x="500" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RapidOCR · only when routed</text>

<rect x="40" y="240" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="240" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Regex + validators + address</text>
<text x="160" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">email phone PAN Aadhaar DIN · PIN-anchored</text>

<rect x="360" y="240" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="360" y="240" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">GLiNER2-PII encoder</text>
<text x="480" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">labels from config · CPU ~1 s/page</text>

<rect x="660" y="240" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="660" y="240" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="780" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">LLM finder</text>
<text x="780" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Ollama qwen2.5:7b | claude-haiku-4-5</text>

<rect x="360" y="400" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="360" y="400" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="480" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Merge · propagate · judge</text>
<text x="480" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">union by word · allowlist · thresholds → review</text>

<rect x="40" y="536" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="536" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="160" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Entities → surrogates</text>
<text x="160" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HMAC-seeded Faker · token-level names</text>

<rect x="360" y="536" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="360" y="536" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Write same format</text>
<text x="480" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">PDF true redaction · DOCX in-place runs</text>

<rect x="680" y="536" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="680" y="536" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="800" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Verify · audit · review</text>
<text x="800" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">search originals · audit.jsonl · LLM flags</text>

